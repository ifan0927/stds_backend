services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-stds}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stds}
      POSTGRES_DB: ${DB_NAME:-stds_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stds} -d ${DB_NAME:-stds_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
