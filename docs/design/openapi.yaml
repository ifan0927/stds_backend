            Location:
              schema:
                type: string
              description: Cloud Storage 簽署 URL
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EstateAccessDenied'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'

# ─────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EstateIdParam:
      name: estateId
      in: path
      required: true
      description: 物業流水號
      schema:
        type: integer
        minimum: 1

    RoomIdParam:
      name: roomId
      in: path
      required: true
      description: 房間流水號
      schema:
        type: integer
        minimum: 1

    UserIdParam:
      name: userId
      in: path
      required: true
      description: 使用者流水號
      schema:
        type: integer
        minimum: 1

    RentIdParam:
      name: rentId
      in: path
      required: true
      description: 租期流水號
      schema:
        type: integer
        minimum: 1

    TenantIdParam:
      name: tenantId
      in: path
      required: true
      description: 房客流水號
      schema:
        type: integer
        minimum: 1

    ScheduleIdParam:
      name: scheduleId
      in: path
      required: true
      description: 日誌流水號
      schema:
        type: integer
        minimum: 1

    ReplyIdParam:
      name: replyId
      in: path
      required: true
      description: 回應流水號
      schema:
        type: integer
        minimum: 1

    AccountingIdParam:
      name: accountingId
      in: path
      required: true
      description: 帳務流水號
      schema:
        type: integer
        minimum: 1

    GroupIdParam:
      name: groupId
      in: path
      required: true
      description: 群組流水號
      schema:
        type: integer
        minimum: 1

    AttachmentIdParam:
      name: attachmentId
      in: path
      required: true
      description: 附件流水號
      schema:
        type: integer
        minimum: 1

    PageParam:
      name: page
      in: query
      description: 頁碼（從 1 開始）
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSizeParam:
      name: pageSize
      in: query
      description: 每頁筆數
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    # ── 通用結構 ──────────────────────────────

    PaginatedResponse:
      type: object
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          description: 總筆數
        page:
          type: integer
          description: 當前頁碼
        pageSize:
          type: integer
          description: 每頁筆數

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 錯誤代碼（SNAKE_UPPER_CASE）
        message:
          type: string
          description: 人類可讀說明
        details:
          type: array
          description: 欄位驗證錯誤明細（僅 VALIDATION_ERROR 時出現）
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    # ── 物業（Estate）────────────────────────

    EstateSummary:
      type: object
      description: 物業清單項目（精簡版）
      required: [estateId, title, shortTitle]
      properties:
        estateId:
          type: integer
          description: 物業流水號
        title:
          type: string
          description: 物業全名（案名）
        shortTitle:
          type: string
          description: 物業簡稱

    EstateDetail:
      type: object
      description: 物業詳情
      required: [estateId, title, shortTitle]
      properties:
        estateId:
          type: integer
        title:
          type: string
          description: 物業全名（案名）
        shortTitle:
          type: string
          description: 物業簡稱（用於 Email 標題等）
        ownerUserId:
          type: integer
          description: 業主系統使用者 ID
        address:
          type: string
          description: 物業門牌地址
        phone:
          type: string
          description: 物業聯絡電話
        ownerName:
          type: string
          description: 業主姓名
        ownerEmail:
          type: string
          format: email
          description: 業主 Email
        website:
          type: string
          format: uri
          description: 物業官網網址
        facebook:
          type: string
          description: 物業 Facebook 連結
        note:
          type: string
          description: 物業備註（HTML rich text）
        facilities:
          type: array
          description: 公共設施名稱清單
          items:
            type: string
          example: ["電梯", "停車場", "游泳池"]
        electricityRate:
          type: number
          format: float
          description: 每度電費單價（元/度）
          example: 4.5
        electricityBillingCycle:
          type: string
          enum: [monthly, bimonthly]
          description: 電費收費週期（monthly=單月，bimonthly=雙月）
        zones:
          type: array
          description: 區域/棟別清單
          items:
            type: string
          example: ["A棟", "B棟"]

    EstateCreateRequest:
      type: object
      required: [title, shortTitle, ownerName, ownerEmail, electricityRate, electricityBillingCycle]
      properties:
        title:
          type: string
          maxLength: 255
          description: 物業全名（案名）
        shortTitle:
          type: string
          maxLength: 255
          description: 物業簡稱
        ownerName:
          type: string
          maxLength: 255
          description: 業主姓名
        ownerEmail:
          type: string
          format: email
          maxLength: 255
          description: 業主 Email（用於建立業主帳號）
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 255
        website:
          type: string
          format: uri
          maxLength: 255
        facebook:
          type: string
          maxLength: 255
        note:
          type: string
          description: 備註（HTML rich text）
        facilities:
          type: array
          items:
            type: string
          description: 公共設施名稱清單
        electricityRate:
          type: number
          format: float
          description: 每度電費單價
          default: 4.5
        electricityBillingCycle:
          type: string
          enum: [monthly, bimonthly]
          default: bimonthly
        zones:
          type: array
          items:
            type: string
          description: 區域/棟別清單

    EstateUpdateRequest:
      type: object
      required: [title, shortTitle, ownerName, ownerEmail, electricityRate, electricityBillingCycle]
      properties:
        title:
          type: string
          maxLength: 255
        shortTitle:
          type: string
          maxLength: 255
        ownerName:
          type: string
          maxLength: 255
        ownerEmail:
          type: string
          format: email
          maxLength: 255
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 255
        website:
          type: string
          format: uri
          maxLength: 255
        facebook:
          type: string
          maxLength: 255
        note:
          type: string
        facilities:
          type: array
          items:
            type: string
        electricityRate:
          type: number
          format: float
        electricityBillingCycle:
          type: string
          enum: [monthly, bimonthly]
        zones:
          type: array
          items:
            type: string

    # ── 公共設施備忘錄（Facility）────────────

    FacilityItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 設施名稱（對應 estate.facilities 清單中的值）
        memo:
          type: string
          description: 設施備忘錄（HTML rich text）
        updatedAt:
          type: string
          format: date-time
          description: 最後更新時間（RFC3339）

    FacilityMemoUpdateRequest:
      type: object
      required: [facilityName, memo]
      properties:
        facilityName:
          type: string
          description: 設施名稱（需存在於 estate.facilities 清單中）
        memo:
          type: string
          description: 備忘錄內容（HTML rich text）

    # ── 物業成員（Member）────────────────────

    EstateMember:
      type: object
      required: [userId, memberLevel]
      properties:
        userId:
          type: integer
          description: 使用者 ID
        name:
          type: string
          description: 顯示名稱
        username:
          type: string
          description: 登入帳號
        unit:
          type: string
          description: 所屬單位名稱
        title:
          type: string
          description: 職稱（如「主承辦人」）
        memberLevel:
          type: string
          enum: [admin, readonly]
          description: 管理權限（admin=管理員，readonly=唯讀/通知成員）
        calendarTextColor:
          type: string
          description: 行事曆文字顏色（hex，如 #FFFFFF）
          example: '#FFFFFF'
        calendarBgColor:
          type: string
          description: 行事曆背景顏色（hex，如 #6EB3E5）
          example: '#6EB3E5'

    EstateMemberListUpdateRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          description: 成員 userId 完整清單（以此清單取代現有成員分配）
          items:
            type: integer
          minItems: 0

    EstateMemberUpdateRequest:
      type: object
      properties:
        unit:
          type: string
          maxLength: 255
          description: 所屬單位名稱
        title:
          type: string
          maxLength: 255
          description: 職稱
        memberLevel:
          type: string
          enum: [admin, readonly]
          description: 管理權限
        calendarTextColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: 行事曆文字顏色（hex）
        calendarBgColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: 行事曆背景顏色（hex）

    # ── 房間（Room）──────────────────────────

    RoomPrice:
      type: object
      description: 各繳費週期的租金定價。未設定的週期值為 null。
      properties:
        yearly:
          type: integer
          nullable: true
          description: 年繳金額（元）；未設定時為 null
        halfYearly:
          type: integer
          nullable: true
          description: 半年繳金額（元）；未設定時為 null
        quarterly:
          type: integer
          nullable: true
          description: 季繳金額（元）；未設定時為 null
        monthly:
          type: integer
          nullable: true
          description: 月繳金額（元）；未設定時為 null

    RoomSummary:
      type: object
      description: 房間清單項目（精簡版）
      required: [roomId, estateId, roomNumber]
      properties:
        roomId:
          type: integer
        estateId:
          type: integer
        roomNumber:
          type: string
          description: 房號（如 A101）
        storey:
          type: string
          description: 所在樓層
        roomType:
          type: string
          description: 房型（如 2房1廳）
        sizeSquareMeter:
          type: number
          format: float
          description: 坪數
        zone:
          type: string
          description: 所屬棟別/區域
        sortOrder:
          type: integer
          description: 顯示排序
        activeRentId:
          type: integer
          nullable: true
          description: 現役租約 ID（無租約時為 null）

    RoomDetail:
      type: object
      description: 房間詳情
      required: [roomId, estateId, roomNumber]
      properties:
        roomId:
          type: integer
        estateId:
          type: integer
        roomNumber:
          type: string
          description: 房號（如 A101）
        storey:
          type: string
          description: 所在樓層
        roomType:
          type: string
          description: 房型
        sizeSquareMeter:
          type: number
          format: float
          description: 坪數
        facilities:
          type: object
          nullable: true
          additionalProperties:
            type: integer
            minimum: 0
          description: '房間設備清單。key 為設備名稱，value 為數量（0 表示不含此設備）。例：{"床組": 1, "書桌": 2, "電視": 0}'
        prices:
          $ref: '#/components/schemas/RoomPrice'
        note:
          type: string
          description: 備註（HTML rich text）
        sortOrder:
          type: integer
        zone:
          type: string
          description: 所屬棟別/區域

    RoomCreateRequest:
      type: object
      required: [roomNumber]
      properties:
        roomNumber:
          type: string
          maxLength: 255
          description: 房號（如 A101）
        storey:
          type: string
          maxLength: 255
        roomType:
          type: string
          maxLength: 255
        sizeSquareMeter:
          type: number
          format: float
          minimum: 0
        facilities:
          type: object
          nullable: true
          additionalProperties:
            type: integer
            minimum: 0
          description: '房間設備清單。key 為設備名稱，value 為數量（0 表示不含此設備）。例：{"床組": 1, "書桌": 2, "電視": 0}'
        prices:
          $ref: '#/components/schemas/RoomPrice'
        note:
          type: string
        sortOrder:
          type: integer
          description: 未提供時自動取最大排序 + 1
        zone:
          type: string
          maxLength: 255
          description: 所屬棟別/區域（需對應物業設定的 zones 其中一個值）

    RoomUpdateRequest:
      type: object
      required: [roomNumber]
      properties:
        roomNumber:
          type: string
          maxLength: 255
        storey:
          type: string
          maxLength: 255
        roomType:
          type: string
          maxLength: 255
        sizeSquareMeter:
          type: number
          format: float
          minimum: 0
        facilities:
          type: object
          nullable: true
          additionalProperties:
            type: integer
            minimum: 0
          description: '房間設備清單。key 為設備名稱，value 為數量（0 表示不含此設備）。例：{"床組": 1, "書桌": 2, "電視": 0}'
        prices:
          $ref: '#/components/schemas/RoomPrice'
        note:
          type: string
        sortOrder:
          type: integer
        zone:
          type: string
          maxLength: 255

    RoomSortUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 完整房間排序清單
          items:
            type: object
            required: [roomId, sortOrder]
            properties:
              roomId:
                type: integer
              sortOrder:
                type: integer
                minimum: 0

    # ── 租賃（Rent）──────────────────────────

    RentSummary:
      type: object
      description: 租期清單項目（精簡版）
      required: [rentId, roomId, startDate, endDate, paymentMethod, status]
      properties:
        rentId:
          type: integer
          description: 租期流水號
        roomId:
          type: integer
          description: 所屬房間 ID
        roomNumber:
          type: string
          description: 房號（如 A101）
        startDate:
          type: string
          format: date
          description: 租約起始日（YYYY-MM-DD）
        endDate:
          type: string
          format: date
          description: 租約到期日（YYYY-MM-DD）
        earlyMoveInDate:
          type: string
          format: date
          nullable: true
          description: 提前入住日（null 表示無）
        paymentMethod:
          type: string
          enum: [yearly, halfYearly, quarterly, monthly]
          description: 繳費方式（yearly=年繳，halfYearly=半年，quarterly=季繳，monthly=月繳）
        deposit:
          type: integer
          description: 押金金額（元）
        status:
          type: string
          enum: [active, archived]
          description: 租約狀態（active=現役，archived=已封存/退租）
        renewalStatus:
          type: string
          enum: [unset, renew, no_renew]
          description: 到期續租意向（unset=未設定，renew=續租，no_renew=不續租）
        daysRemaining:
          type: integer
          nullable: true
          description: 距到期日剩餘天數（已退租時為 null）
        primaryTenantName:
          type: string
          nullable: true
          description: 主房客姓名（第一位關聯房客）

    RentDetail:
      type: object
      description: 租期詳情
      required: [rentId, roomId, startDate, endDate, paymentMethod, status]
      properties:
        rentId:
          type: integer
        roomId:
          type: integer
        roomNumber:
          type: string
          description: 房號
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        earlyMoveInDate:
          type: string
          format: date
          nullable: true
        deposit:
          type: integer
          description: 押金金額（元）
        paymentMethod:
          type: string
          enum: [yearly, halfYearly, quarterly, monthly]
        initialElectricReading:
          type: number
          format: float
          description: 入住時起始電錶累積度數
        renewalStatus:
          type: string
          enum: [unset, renew, no_renew]
        note:
          type: string
          description: 備註（HTML rich text）
        petInfo:
          type: string
          description: 寵物資訊
        status:
          type: string
          enum: [active, archived]
        terminationInfo:
          $ref: '#/components/schemas/TerminationInfo'
          description: 退租結算資訊（僅 status=archived 時有值）
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
          description: 關聯房客清單

    RentCreateRequest:
      type: object
      required: [roomId, startDate, endDate, paymentMethod, deposit, initialElectricReading]
      properties:
        roomId:
          type: integer
          description: 所屬房間 ID
          minimum: 1
        startDate:
          type: string
          format: date
          description: 租約起始日（YYYY-MM-DD）
        endDate:
          type: string
          format: date
          description: 租約到期日（YYYY-MM-DD，需晚於 startDate）
        earlyMoveInDate:
          type: string
          format: date
          nullable: true
          description: 提前入住日（選填，需早於或等於 startDate）
        deposit:
          type: integer
          minimum: 0
          description: 押金金額（元）
        paymentMethod:
          type: string
          enum: [yearly, halfYearly, quarterly, monthly]
          description: 繳費方式
        initialElectricReading:
          type: number
          format: float
          minimum: 0
          description: 入住時起始電錶累積度數
        renewalStatus:
          type: string
          enum: [unset, renew, no_renew]
          default: unset
          description: 到期續租意向
        note:
          type: string
          description: 備註（HTML rich text）
        petInfo:
          type: string
          maxLength: 255
          description: 寵物資訊
        tenants:
          type: array
          description: |
            建立租約時同步關聯的現有房客清單（選填）。
            每個元素為已存在的 tenantId reference。
            若需建立新房客，請先呼叫 POST /v1/tenants，取得 tenantId 後再傳入此欄位。
          items:
            $ref: '#/components/schemas/RentTenantRef'

    RentUpdateRequest:
      type: object
      required: [startDate, endDate, paymentMethod, deposit, initialElectricReading]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        earlyMoveInDate:
          type: string
          format: date
          nullable: true
        deposit:
          type: integer
          minimum: 0
        paymentMethod:
          type: string
          enum: [yearly, halfYearly, quarterly, monthly]
        initialElectricReading:
          type: number
          format: float
          minimum: 0
        renewalStatus:
          type: string
          enum: [unset, renew, no_renew]
        note:
          type: string
        petInfo:
          type: string
          maxLength: 255

    TerminateRentRequest:
      type: object
      required: [terminationDate, finalElectricReading, reason]
      properties:
        terminationDate:
          type: string
          format: date
          description: 退租日期（YYYY-MM-DD）
        finalElectricReading:
          type: number
          format: float
          minimum: 0
          description: 退租時電錶累積度數（需大於等於入住起始度數）
        reason:
          type: string
          description: 退租原因（如「租約到期」）
        additionalCharges:
          type: object
          description: 額外費用（向房客收取）
          properties:
            damageFee:
              type: integer
              minimum: 0
              description: 毀損費（元）
              default: 0
            cleaningFee:
              type: integer
              minimum: 0
              description: 清潔費（元）
              default: 0
            otherFee:
              type: integer
              minimum: 0
              description: 其他費用（元）
              default: 0
            rentBack:
              type: integer
              minimum: 0
              description: 未到期租金退還（元）
              default: 0

    TerminateRentPreview:
      type: object
      description: 退租結算預覽（不寫入 DB）
      required: [electricityCost, depositRefund, totalRefund]
      properties:
        initialElectricReading:
          type: number
          format: float
          description: 入住時起始電錶度數
        finalElectricReading:
          type: number
          format: float
          description: 退租時電錶度數
        electricityUsage:
          type: number
          format: float
          description: 用電度數（finalElectricReading - initialElectricReading）
        electricityRate:
          type: number
          format: float
          description: 每度電費單價（來自物業設定）
        electricityCost:
          type: integer
          description: 電費（元）= 用電度數 × 單價，四捨五入
        depositRefund:
          type: integer
          description: 應退押金（元，以負數表示退款）
        additionalCharges:
          type: object
          properties:
            damageFee:
              type: integer
            cleaningFee:
              type: integer
            otherFee:
              type: integer
            rentBack:
              type: integer
        totalRefund:
          type: integer
          description: 總退款金額（元，負數表示退款給房客）

    TerminationInfo:
      type: object
      description: 退租結算資訊（儲存於租約記錄）
      properties:
        reason:
          type: string
          description: 退租原因
        terminationDate:
          type: string
          format: date-time
          description: 退租日期時間（RFC3339）
        operatorUserId:
          type: integer
          description: 執行退租的使用者 ID
        initialElectricReading:
          type: number
          format: float
        finalElectricReading:
          type: number
          format: float
        electricityCost:
          type: integer
          description: 電費（元）
        depositRefund:
          type: integer
          description: 退押金（元，負數）
        totalRefund:
          type: integer
          description: 總退款（元，負數為退款）
        primaryTenantName:
          type: string
          description: 主房客姓名
        additionalCharges:
          type: object
          properties:
            damageFee:
              type: integer
            cleaningFee:
              type: integer
            otherFee:
              type: integer
            rentBack:
              type: integer

    PaymentReminder:
      type: object
      description: 繳費到期提醒項目
      required: [rentId, roomId, nextPaymentDate]
      properties:
        rentId:
          type: integer
        roomId:
          type: integer
        roomNumber:
          type: string
        primaryTenantName:
          type: string
          nullable: true
        paymentMethod:
          type: string
          enum: [yearly, halfYearly, quarterly, monthly]
        nextPaymentDate:
          type: string
          format: date
          description: 下次應繳日（YYYY-MM-DD）
        daysUntilDue:
          type: integer
          description: 距下次應繳日天數（負數表示已逾期）
        isPaid:
          type: boolean
          description: 是否已繳本期

    PaymentScheduleItem:
      type: object
      description: 租金應繳時程項目
      required: [dueDate, isPaid]
      properties:
        dueDate:
          type: string
          format: date
          description: 應繳日（YYYY-MM-DD）
        isPaid:
          type: boolean
          description: 是否已繳
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: 繳費時間（RFC3339，未繳時為 null）
        accountingId:
          type: integer
          nullable: true
          description: 對應帳務記錄 ID（未繳時為 null）

    # ── 房客（Tenant）────────────────────────

    RentTenantRef:
      type: object
      description: 建立租約時用於 reference 既有房客的簡易結構
      required: [tenantId]
      properties:
        tenantId:
          type: integer
          description: 已存在的房客流水號
          minimum: 1

    TenantLinkRequest:
      type: object
      description: 將現有房客關聯至租期的請求
      required: [tenantId]
      properties:
        tenantId:
          type: integer
          description: 要關聯的房客流水號
          minimum: 1

    Tenant:
      type: object
      description: 房客資料
      required: [tenantId, name]
      properties:
        tenantId:
          type: integer
          description: 房客流水號
        name:
          type: string
          description: 房客姓名
        birthday:
          type: string
          format: date
          nullable: true
          description: 生日（YYYY-MM-DD）
        nationalId:
          type: string
          description: 身份證號
        registeredAddress:
          type: string
          description: 戶籍地址
        phone:
          type: string
          description: 聯絡電話
        occupation:
          type: string
          description: 職業
        emergencyContact:
          type: string
          description: 緊急聯絡人
        email:
          type: string
          format: email
          description: Email
        note:
          type: string
          description: 備註

    TenantCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: 房客姓名
        birthday:
          type: string
          format: date
          description: 生日（YYYY-MM-DD）
        nationalId:
          type: string
          maxLength: 255
          description: 身份證號
        registeredAddress:
          type: string
          maxLength: 255
          description: 戶籍地址
        phone:
          type: string
          maxLength: 255
          description: 聯絡電話
        occupation:
          type: string
          maxLength: 255
          description: 職業
        emergencyContact:
          type: string
          maxLength: 255
          description: 緊急聯絡人
        email:
          type: string
          format: email
          maxLength: 255
          description: Email
        note:
          type: string
          description: 備註

    TenantUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        birthday:
          type: string
          format: date
        nationalId:
          type: string
          maxLength: 255
        registeredAddress:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 255
        occupation:
          type: string
          maxLength: 255
        emergencyContact:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        note:
          type: string

    # ── 電費（Electric）──────────────────────

    ElectricReadingItem:
      type: object
      description: 單筆電錶度數記錄
      required: [roomId, year, month, degrees]
      properties:
        roomId:
          type: integer
          description: 房間 ID
        roomNumber:
          type: string
          description: 房號（如 A101）
        year:
          type: integer
          description: 記錄年份
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: 記錄月份（1-12）
        degrees:
          type: number
          format: float
          description: 電錶累積度數（累積值，非當月用量）
        recordedBy:
          type: integer
          nullable: true
          description: 記錄者 userId
        updatedAt:
          type: string
          format: date-time
          description: 最後更新時間（RFC3339）

    ElectricReadingRoomEntry:
      type: object
      description: 單一房間在查詢期間的電錶度數資料
      required: [roomId, roomNumber, readings]
      properties:
        roomId:
          type: integer
        roomNumber:
          type: string
          description: 房號
        zone:
          type: string
          nullable: true
          description: 所屬棟別/區域
        readings:
          type: array
          description: 此房間在查詢期間各月份的電錶度數（無記錄的月份不出現）
          items:
            type: object
            required: [year, month]
            properties:
              year:
                type: integer
              month:
                type: integer
                minimum: 1
                maximum: 12
              degrees:
                type: number
                format: float
                nullable: true
                description: 電錶累積度數（null 表示該月尚未輸入）
              updatedAt:
                type: string
                format: date-time
                nullable: true

    ElectricReadingListResponse:
      type: object
      description: 電錶度數查詢結果
      required: [estateId, electricityRate, months, rooms]
      properties:
        estateId:
          type: integer
        electricityRate:
          type: number
          format: float
          description: 每度電費單價（元/度），來自 estate.electricityRate
        months:
          type: array
          description: 查詢涵蓋的年月清單（依時間順序排列）
          items:
            type: object
            required: [year, month]
            properties:
              year:
                type: integer
              month:
                type: integer
                minimum: 1
                maximum: 12
        rooms:
          type: array
          description: 各房間電錶度數資料
          items:
            $ref: '#/components/schemas/ElectricReadingRoomEntry'

    ElectricReadingUpsertItem:
      type: object
      description: 單筆電錶度數 upsert 項目
      required: [roomId, year, month, degrees]
      properties:
        roomId:
          type: integer
          description: 房間 ID（必須屬於此物業）
        year:
          type: integer
          minimum: 2000
          maximum: 9999
          description: 記錄年份
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: 記錄月份（1-12）
        degrees:
          type: number
          format: float
          minimum: 0
          description: 電錶累積度數

    ElectricReadingBatchUpsertRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          description: 要 upsert 的電錶度數清單（僅提交有值的格子）
          items:
            $ref: '#/components/schemas/ElectricReadingUpsertItem'

    # ── 日誌/排程（Schedule）────────────────────

    ScheduleSummary:
      type: object
      description: 日誌摘要（用於清單顯示）
      required: [scheduleId, estateId, scheduledAt, kind, status, reporterUserId, createdAt]
      properties:
        scheduleId:
          type: integer
          description: 日誌流水號
        estateId:
          type: integer
          description: 所屬物業 ID
        roomId:
          type: integer
          nullable: true
          description: 關聯房間 ID（null 表示物業整體）
        roomNumber:
          type: string
          nullable: true
          description: 房號（roomId 為 null 時此欄位也為 null）
        scheduledAt:
          type: string
          format: date-time
          description: 辦理日期時間（RFC3339）
        kind:
          type: string
          description: 日誌分類（如「例行」「叫修」，值來自系統設定）
        status:
          type: string
          description: 辦理狀況（如「處理中」，值來自系統設定）
        statusColor:
          type: string
          nullable: true
          description: 辦理狀況對應的顏色（hex，如 #FF0000）
        contentSnippet:
          type: string
          description: 日誌內容摘要（純文字，去除 HTML，最多 100 字元）
        reporterUserId:
          type: integer
          description: 填報人 userId
        reporterName:
          type: string
          description: 填報人顯示名稱
        assistUserId:
          type: integer
          nullable: true
          description: |
            協辦人員：
            - null = 無協辦人
            - 0 = 全體人員
            - >0 = 指定使用者的 userId
        assistName:
          type: string
          nullable: true
          description: 協辦人員顯示名稱（null=無，"全體人員"=0，名稱=>0）
        replyCount:
          type: integer
          description: 回應數量
        createdAt:
          type: string
          format: date-time
          description: 建立時間（RFC3339）

    Schedule:
      type: object
      description: 日誌完整資訊（不含回應清單，供 POST/PUT 回應使用）
      required: [scheduleId, estateId, scheduledAt, kind, status, reporterUserId, createdAt]
      properties:
        scheduleId:
          type: integer
        estateId:
          type: integer
        roomId:
          type: integer
          nullable: true
          description: 關聯房間 ID（null 表示物業整體）
        roomNumber:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          description: 辦理日期時間（RFC3339）
        kind:
          type: string
          description: 日誌分類
        status:
          type: string
          description: 辦理狀況
        statusColor:
          type: string
          nullable: true
          description: 辦理狀況顏色（hex）
        content:
          type: string
          description: 日誌內容（HTML，CkEditor 輸出）
        reporterUserId:
          type: integer
        reporterName:
          type: string
        assistUserId:
          type: integer
          nullable: true
          description: |
            協辦人員：null=無，0=全體人員，>0=指定 userId
        assistName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ScheduleDetail:
      allOf:
        - $ref: '#/components/schemas/Schedule'
        - type: object
          description: 日誌詳情（含回應清單與帳務記錄）
          properties:
            replies:
              type: array
              description: 回應清單（依 replyId 升序）
              items:
                $ref: '#/components/schemas/Reply'
            accountings:
              type: array
              description: 關聯帳務記錄清單
              items:
                type: object
                properties:
                  accountingId:
                    type: integer
                  tag:
                    type: string
                    description: 帳務標記（如「日誌」）
                  income:
                    type: integer
                    description: 收入金額（元）
                  expenditure:
                    type: integer
                    description: 支出金額（元）
                  accountingDate:
                    type: string
                    format: date-time
                  title:
                    type: string
                    description: 科目說明

    ScheduleListResponse:
      type: object
      description: 日誌清單回應（含分頁與月份導覽）
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleSummary'
        total:
          type: integer
          description: 符合條件的總筆數
        page:
          type: integer
        pageSize:
          type: integer
        monthGroups:
          type: array
          description: |
            月份分組導覽清單（依年月降序），僅在未指定 roomId 過濾時回傳。
            供 client 渲染月份側欄選單使用。
          items:
            type: object
            required: [yearMonth, label]
            properties:
              yearMonth:
                type: string
                description: 年月字串（格式 YYYY-MM）
              label:
                type: string
                description: 顯示標籤（如「2026年03月」）

    ScheduleCreateRequest:
      type: object
      required: [scheduledAt, kind, status, content]
      properties:
        roomId:
          type: integer
          nullable: true
          minimum: 1
          description: 關聯房間 ID（不帶或 null 表示物業整體）
        scheduledAt:
          type: string
          format: date-time
          description: 辦理日期時間（RFC3339）
        kind:
          type: string
          maxLength: 255
          description: 日誌分類（值應與系統設定的 log_type 一致）
        status:
          type: string
          maxLength: 255
          description: 辦理狀況（值應與系統設定的 status_opt 一致）
        content:
          type: string
          description: 日誌內容（HTML，CkEditor 輸出）
        reporterUserId:
          type: integer
          minimum: 1
          description: 填報人 userId（不帶時由 JWT 取得當前使用者）
        assistUserId:
          type: integer
          nullable: true
          description: |
            協辦人員：
            - 不帶或 null = 無協辦人
            - 0 = 全體人員
            - >0 = 指定使用者的 userId

    ScheduleUpdateRequest:
      type: object
      required: [scheduledAt, kind, status, content]
      properties:
        roomId:
          type: integer
          nullable: true
          minimum: 1
          description: 關聯房間 ID（null 表示物業整體）
        scheduledAt:
          type: string
          format: date-time
          description: 辦理日期時間（RFC3339）
        kind:
          type: string
          maxLength: 255
          description: 日誌分類
        status:
          type: string
          maxLength: 255
          description: 辦理狀況
        content:
          type: string
          description: 日誌內容（HTML）
        assistUserId:
          type: integer
          nullable: true
          description: |
            協辦人員：null=無，0=全體人員，>0=指定 userId
            注意：填報人（reporterUserId）編輯時不可修改（與舊系統一致）

    Reply:
      type: object
      description: 日誌回應
      required: [replyId, scheduleId, content, authorUserId, repliedAt]
      properties:
        replyId:
          type: integer
          description: 回應流水號
        scheduleId:
          type: integer
          description: 所屬日誌 ID
        content:
          type: string
          description: 回應內容（HTML，CkEditor 輸出）
        authorUserId:
          type: integer
          description: 回應者 userId
        authorName:
          type: string
          description: 回應者顯示名稱
        repliedAt:
          type: string
          format: date-time
          description: 回應日期時間（RFC3339，由系統寫入）

    ReplyCreateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 回應內容（HTML，CkEditor 輸出）
        authorUserId:
          type: integer
          minimum: 1
          description: 回應者 userId（不帶時由 JWT 取得當前使用者）

    ReplyUpdateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 回應內容（HTML，CkEditor 輸出）

    # ── 使用者（User）────────────────────────

    UserSummary:
      type: object
      required: [userId, username]
      properties:
        userId:
          type: integer
        name:
          type: string
          description: 顯示名稱
        username:
          type: string
          description: 登入帳號

    UserDetail:
      type: object
      description: 使用者完整資料（不含密碼）
      required: [userId, username, role, isEnabled]
      properties:
        userId:
          type: integer
          description: 使用者流水號
        name:
          type: string
          description: 顯示名稱（真實姓名）
        username:
          type: string
          description: 登入帳號（最長 25 字元）
        email:
          type: string
          format: email
          description: Email
        role:
          type: string
          enum: [admin, user]
          description: |
            系統層角色。
            - `admin`：系統管理員，可管理物業、使用者、群組
            - `user`：一般使用者，只能存取被授權的物業
        occupation:
          type: string
          description: 職業
        bio:
          type: string
          description: 簡介
        isEnabled:
          type: boolean
          description: 帳號是否啟用（對應舊系統 level=1）
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: 最後登入時間（RFC3339；未曾登入時為 null）
        createdAt:
          type: string
          format: date-time
          description: 帳號建立時間（RFC3339）
        groups:
          type: array
          description: 所屬群組清單
          items:
            $ref: '#/components/schemas/UserGroupRef'

    UserGroupRef:
      type: object
      description: 使用者所屬群組的簡要資訊
      required: [groupId, name]
      properties:
        groupId:
          type: integer
          description: 群組流水號
        name:
          type: string
          description: 群組名稱

    UserCreateRequest:
      type: object
      required: [username, name, email, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 25
          description: 登入帳號（唯一，建立後不可更改）
        name:
          type: string
          maxLength: 60
          description: 顯示名稱（真實姓名）
        email:
          type: string
          format: email
          maxLength: 60
          description: Email
        password:
          type: string
          minLength: 6
          description: 初始密碼（服務端以 bcrypt 儲存，永不在 response 出現）
        role:
          type: string
          enum: [admin, user]
          default: user
          description: 系統層角色（選填，預設為 user）
        occupation:
          type: string
          maxLength: 100
          description: 職業
        bio:
          type: string
          description: 簡介
        groupIds:
          type: array
          description: 新建後加入的群組 ID 清單（選填）
          items:
            type: integer
            minimum: 1

    UserUpdateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 60
          description: 顯示名稱（真實姓名）
        email:
          type: string
          format: email
          maxLength: 60
          description: Email
        password:
          type: string
          minLength: 6
          description: 新密碼（選填，不提供則不更改密碼；以 bcrypt 儲存）
        role:
          type: string
          enum: [admin, user]
          description: 系統層角色（選填，不提供則不更改）
        occupation:
          type: string
          maxLength: 100
          description: 職業
        bio:
          type: string
          description: 簡介
        isEnabled:
          type: boolean
          description: 是否啟用帳號
        groupIds:
          type: array
          description: 使用者所屬群組 ID 清單（完整取代現有群組關聯）
          items:
            type: integer
            minimum: 1

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          description: 目前的密碼（用於驗證身份，不得為空）
          example: secret123
        newPassword:
          type: string
          minLength: 6
          description: 新密碼（至少 6 個字元；服務端以 bcrypt 儲存，永不在 response 出現）
          example: newSecret456

    UserBatchCreateRequest:
      type: object
      required: [users]
      properties:
        users:
          type: array
          minItems: 1
          description: 要批次建立的使用者清單
          items:
            $ref: '#/components/schemas/UserCreateRequest'

    UserImportResult:
      type: object
      description: CSV 匯入使用者的結果摘要
      required: [totalRows, successCount, failureCount]
      properties:
        totalRows:
          type: integer
          description: CSV 總列數（不含標題列）
        successCount:
          type: integer
          description: 成功匯入的使用者數量
        failureCount:
          type: integer
          description: 匯入失敗的列數
        failures:
          type: array
          description: 失敗明細清單
          items:
            type: object
            required: [rowNumber, username, reason]
            properties:
              rowNumber:
                type: integer
                description: CSV 中的列號（從 2 開始，1 為標題列）
              username:
                type: string
                description: 該列的 username 值
              reason:
                type: string
                description: 失敗原因（如「帳號已存在」「缺少必填欄位」）

    BatchGroupRequest:
      type: object
      required: [userIds, groupId]
      properties:
        userIds:
          type: array
          minItems: 1
          description: 要操作的使用者 ID 清單
          items:
            type: integer
            minimum: 1
        groupId:
          type: integer
          minimum: 1
          description: 目標群組 ID

    BatchGroupResult:
      type: object
      required: [affectedCount]
      properties:
        affectedCount:
          type: integer
          description: 實際被操作的使用者數量（已在群組/不在群組者略過不計入）

    BatchUpdateFieldRequest:
      type: object
      required: [userIds, field, value]
      properties:
        userIds:
          type: array
          minItems: 1
          description: 要操作的使用者 ID 清單
          items:
            type: integer
            minimum: 1
        field:
          type: string
          enum: [isEnabled, occupation, bio]
          description: 要更新的欄位名稱（密碼欄位不支援批次更新）
        value:
          description: |
            要設定的值。型別依 field 而定：
            - isEnabled: boolean
            - occupation: string（最長 100 字元）
            - bio: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 登入帳號
          example: alice
        password:
          type: string
          description: 密碼（明文，HTTPS 傳輸）
          example: secret123

    LoginResponse:
      type: object
      required: [access_token, expiresAt, user]
      properties:
        access_token:
          type: string
          description: JWT access token（Bearer token，用於後續 Authorization header）
        expiresAt:
          type: string
          format: date-time
          description: access_token 過期時間（RFC3339）
        user:
          $ref: '#/components/schemas/UserDetail'

    UsernameCheckResponse:
      type: object
      required: [username, exists]
      properties:
        username:
          type: string
          description: 查詢的帳號名稱
        exists:
          type: boolean
          description: 是否已存在（true=已被使用，false=可使用）

    # ── 帳務（Accounting）─────────────────────

    AccountingTitle:
      type: object
      description: 單筆會計科目
      required: [titleId, kind, title]
      properties:
        titleId:
          type: integer
          description: 科目編號（如 4604、6601）
        kind:
          type: string
          enum: [expense, income]
          description: 科目類別（expense=費用類，income=收益類）
        title:
          type: string
          description: 科目名稱（如「租金收入」）

    AccountingTitleListResponse:
      type: object
      description: 會計科目清單回應（依類別分組）
      required: [expenseTitles, incomeTitles]
      properties:
        expenseTitles:
          type: array
          description: 費用類科目（46xx）
          items:
            $ref: '#/components/schemas/AccountingTitle'
        incomeTitles:
          type: array
          description: 收益類科目（66xx）
          items:
            $ref: '#/components/schemas/AccountingTitle'

    Accounting:
      type: object
      description: 帳務記錄
      required: [accountingId, estateId, income, expenditure, accountingDate, createdBy]
      properties:
        accountingId:
          type: integer
          description: 帳務流水號
        estateId:
          type: integer
          description: 所屬物業 ID
        titleId:
          type: integer
          nullable: true
          description: 科目編號（對應 AccountingTitle.titleId）
        titleName:
          type: string
          nullable: true
          description: 科目名稱（冗餘欄位，便於顯示）
        description:
          type: string
          nullable: true
          description: 科目說明（自訂文字，可由系統自動填入）
        income:
          type: integer
          description: 收入金額（元，0 表示無收入）
        expenditure:
          type: integer
          description: 支出金額（元，0 表示無支出）
        accountingDate:
          type: string
          format: date-time
          description: 帳務日期時間（RFC3339）
        paymentMethod:
          type: string
          nullable: true
          description: 付款方式（如「現金」）
        counterparty:
          type: string
          nullable: true
          description: 交易對象（如房客姓名）
        tag:
          type: string
          nullable: true
          description: 帳務標記（業務語意標籤，如「押金」「租金」「電費」「日誌」「退租其他費用」）
        code:
          type: string
          nullable: true
          description: 辨識碼（如 "{rentId}-{日期}"，用於判斷特定期次是否已繳）
        linkedResourceType:
          type: string
          nullable: true
          enum: [rent, schedule]
          description: 關聯的業務資源類型
        linkedResourceId:
          type: integer
          nullable: true
          description: 關聯的業務資源 ID
        cashAccountId:
          type: integer
          nullable: true
          description: 零用金帳戶 ID（預留欄位，income 模組啟用後生效；目前不處理）
        createdBy:
          type: integer
          description: 記錄者 userId
        createdAt:
          type: string
          format: date-time
          description: 建立時間（RFC3339）

    AccountingCreateRequest:
      type: object
      required: [accountingDate, income, expenditure]
      properties:
        titleId:
          type: integer
          nullable: true
          description: 科目編號（選填，需為此物業適用的科目）
        description:
          type: string
          nullable: true
          maxLength: 255
          description: 科目說明（自訂文字）
        income:
          type: integer
          minimum: 0
          description: 收入金額（元）；income 與 expenditure 不可同時為非零值
        expenditure:
          type: integer
          minimum: 0
          description: 支出金額（元）；income 與 expenditure 不可同時為非零值
        accountingDate:
          type: string
          format: date-time
          description: 帳務日期時間（RFC3339）
        paymentMethod:
          type: string
          nullable: true
          maxLength: 255
          description: 付款方式（如「現金」）
        counterparty:
          type: string
          nullable: true
          maxLength: 255
          description: 交易對象（如房客姓名）
        tag:
          type: string
          nullable: true
          maxLength: 255
          description: 帳務標記（業務語意標籤）
        code:
          type: string
          nullable: true
          maxLength: 255
          description: 辨識碼（如 "{rentId}-{日期}"）
        linkedResourceType:
          type: string
          nullable: true
          enum: [rent, schedule]
          description: 關聯的業務資源類型（需與 linkedResourceId 同時提供）
        linkedResourceId:
          type: integer
          nullable: true
          minimum: 1
          description: 關聯的業務資源 ID（需與 linkedResourceType 同時提供）
        cashAccountId:
          type: integer
          nullable: true
          description: 零用金帳戶 ID（預留，目前不觸發副作用）

    AccountingUpdateRequest:
      type: object
      required: [accountingDate, income, expenditure]
      properties:
        titleId:
          type: integer
          nullable: true
          description: 科目編號
        description:
          type: string
          nullable: true
          maxLength: 255
          description: 科目說明
        income:
          type: integer
          minimum: 0
          description: 收入金額（元）；income 與 expenditure 不可同時為非零值
        expenditure:
          type: integer
          minimum: 0
          description: 支出金額（元）；income 與 expenditure 不可同時為非零值
        accountingDate:
          type: string
          format: date-time
          description: 帳務日期時間（RFC3339）
        paymentMethod:
          type: string
          nullable: true
          maxLength: 255
          description: 付款方式
        counterparty:
          type: string
          nullable: true
          maxLength: 255
          description: 交易對象
        tag:
          type: string
          nullable: true
          maxLength: 255
          description: 帳務標記
        code:
          type: string
          nullable: true
          maxLength: 255
          description: 辨識碼
        linkedResourceType:
          type: string
          nullable: true
          enum: [rent, schedule]
          description: 關聯的業務資源類型
        linkedResourceId:
          type: integer
          nullable: true
          minimum: 1
          description: 關聯的業務資源 ID
        cashAccountId:
          type: integer
          nullable: true
          description: 零用金帳戶 ID（預留）

    AccountingOverview:
      type: object
      description: 物業帳務總覽
      required: [estateId, periodFrom, periodTo, previousBalance, periodIncome, periodExpenditure, periodBalance, totalBalance]
      properties:
        estateId:
          type: integer
        periodFrom:
          type: string
          format: date
          description: 本期起始日（YYYY-MM-DD）
        periodTo:
          type: string
          format: date
          description: 本期結束日（YYYY-MM-DD）
        previousBalance:
          type: integer
          description: 上月結餘（截至 periodFrom 前一天的累計結餘，收入-支出）
        periodIncome:
          type: integer
          description: 本期收入合計（元）
        periodExpenditure:
          type: integer
          description: 本期支出合計（元）
        periodBalance:
          type: integer
          description: 本期結餘（periodIncome - periodExpenditure）
        totalBalance:
          type: integer
          description: 累計結餘（previousBalance + periodBalance）
        titleBreakdown:
          type: array
          description: 各科目加總明細（僅在未指定 titleId 時回傳）
          items:
            type: object
            required: [titleId, titleName, kind, totalIncome, totalExpenditure]
            properties:
              titleId:
                type: integer
                nullable: true
                description: 科目編號（null 表示未分類帳務）
              titleName:
                type: string
                nullable: true
                description: 科目名稱（null 表示未分類）
              kind:
                type: string
                enum: [expense, income]
                nullable: true
              totalIncome:
                type: integer
                description: 本期收入小計（元）
              totalExpenditure:
                type: integer
                description: 本期支出小計（元）

    # ── 群組（Groups）─────────────────────────────

    GroupSummary:
      type: object
      description: 群組摘要（用於清單）
      required: [groupId, name, groupType, memberCount]
      properties:
        groupId:
          type: integer
          description: 群組流水號
        name:
          type: string
          description: 群組名稱（最長 50 字元）
        description:
          type: string
          nullable: true
          description: 群組說明
        groupType:
          type: string
          enum: [Global]
          description: 群組類型（新系統固定為 Global；Anonymous 類型不對外列出）
        memberCount:
          type: integer
          description: 群組成員數量

    GroupDetail:
      type: object
      description: 群組詳情（含分頁成員清單）
      required: [groupId, name, groupType, memberCount, members]
      properties:
        groupId:
          type: integer
          description: 群組流水號
        name:
          type: string
          description: 群組名稱（最長 50 字元）
        description:
          type: string
          nullable: true
          description: 群組說明
        groupType:
          type: string
          enum: [Global]
          description: 群組類型（新系統固定為 Global）
        memberCount:
          type: integer
          description: 群組成員總數
        members:
          allOf:
            - $ref: '#/components/schemas/PaginatedResponse'
            - type: object
              properties:
                items:
                  type: array
                  description: 本頁成員清單
                  items:
                    $ref: '#/components/schemas/UserSummary'

    GroupCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 群組名稱（需唯一）
        description:
          type: string
          description: 群組說明（選填）

    GroupUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 群組名稱（需唯一）
        description:
          type: string
          nullable: true
          description: 群組說明（選填；傳入 null 清空說明）

    # ── 附件（Attachments）────────────────────────

    AttachmentItem:
      type: object
      required: [attachmentId, fileName, mimeType, fileSize, storageObjectPath, sortOrder, uploadedAt, uploadedBy]
      properties:
        attachmentId:
          type: integer
          description: 附件流水號
        fileName:
          type: string
          description: 顯示用檔案名稱（原始上傳檔名）
        mimeType:
          type: string
          description: MIME 類型（如 image/jpeg、application/pdf）
        fileSize:
          type: integer
          description: 檔案大小（bytes）
        storageObjectPath:
          type: string
          description: Cloud Storage 物件路徑
        description:
          type: string
          nullable: true
          description: 附件說明（選填）
        sortOrder:
          type: integer
          description: 排序值（同一資源下的附件排序）
        downloadCount:
          type: integer
          description: 下載次數
        tag:
          type: string
          nullable: true
          description: 額外標記（保留給業務邏輯使用）
        uploadedAt:
          type: string
          format: date-time
          description: 上傳時間（RFC3339）
        uploadedBy:
          type: integer
          description: 上傳者的 userId

    AttachmentUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 上傳的檔案（multipart/form-data）
        description:
          type: string
          description: 附件說明（選填，最長 500 字元）
        tag:
          type: string
          description: 額外標記（選填）

    AttachmentUpdateRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
          description: 附件說明（傳入 null 清空說明）

    AttachmentSortRequest:
      type: object
      required: [attachmentIds]
      properties:
        attachmentIds:
          type: array
          description: 依照新排序排列的附件 ID 清單（需包含該資源下所有附件 ID）
          items:
            type: integer
          minItems: 1

  # ── 統一 Response ────────────────────────────

  responses:
    Unauthorized:
      description: 未認證或 Token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            auth_required:
              value:
                code: AUTH_REQUIRED
                message: 請提供有效的 JWT Token
            token_expired:
              value:
                code: TOKEN_EXPIRED
                message: JWT Token 已過期

    Forbidden:
      description: 已認證但無操作權限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: 您無此操作的權限

    EstateAccessDenied:
      description: 無權存取該物業
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ESTATE_ACCESS_DENIED
            message: 您無權存取此物業

    ValidationError:
      description: 欄位驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: 欄位驗證失敗
            details:
              - field: ownerEmail
                message: 不是有效的 Email 格式

    EstateNotFound:
      description: 物業不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ESTATE_NOT_FOUND
            message: 找不到指定的物業

    RoomNotFound:
      description: 房間不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ROOM_NOT_FOUND
            message: 找不到指定的房間

    UserNotFound:
      description: 使用者不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: USER_NOT_FOUND
            message: 找不到指定的使用者
    CannotDeleteHasRoomsOrRents:
      description: 物業下有房間或租約，無法刪除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CANNOT_DELETE_HAS_ROOMS_OR_RENTS
            message: 物業下尚有房間/租約，請先刪除所有房間/租約後再刪除物業

    RentNotFound:
      description: 租約不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RENT_NOT_FOUND
            message: 找不到指定的租約

    TenantNotFound:
      description: 房客不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: TENANT_NOT_FOUND
            message: 找不到指定的房客

    RentAlreadyTerminated:
      description: 租約已退租，不可修改
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RENT_ALREADY_TERMINATED
            message: 此租約已完成退租，不可再修改

    CannotDeleteHasAccounting:
      description: 存在關聯帳務，刪除被擋
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CANNOT_DELETE_HAS_ACCOUNTING
            message: 此租約已有帳務記錄，無法直接刪除

    ScheduleNotFound:
      description: 日誌不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SCHEDULE_NOT_FOUND
            message: 找不到指定的日誌記錄

    AccountingNotFound:
      description: 帳務記錄不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ACCOUNTING_NOT_FOUND
            message: 找不到指定的帳務記錄

    GroupNotFound:
      description: 群組不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: GROUP_NOT_FOUND
            message: 找不到指定的群組

    UsernameAlreadyExists:
      description: 登入帳號已被使用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: USERNAME_ALREADY_EXISTS
            message: 此登入帳號已存在，請使用其他帳號名稱

    GroupHasMembers:
      description: 群組尚有成員，無法刪除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: GROUP_HAS_MEMBERS
            message: 此群組尚有成員，請先移除所有成員後再刪除群組

    GroupNameAlreadyExists:
      description: 群組名稱已被使用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: GROUP_NAME_ALREADY_EXISTS
            message: 此群組名稱已存在，請使用其他名稱

    AttachmentNotFound:
      description: 附件不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ATTACHMENT_NOT_FOUND
            message: 找不到指定的附件

    CurrentPasswordIncorrect:
      description: 現有密碼驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CURRENT_PASSWORD_INCORRECT
            message: 現有密碼不正確

